<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günün Nasıl Geçti Sıla?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            overflow: hidden; /* Sayfa kaymasını engeller */
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        /* Butonların hareket edeceği kapsayıcı alan */
        #button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 600px; /* Daha geniş kaçış alanı */
            height: 200px; /* Daha yüksek kaçış alanı */
            position: relative; /* Butonların hareket referansı */
            box-sizing: border-box; 
        }

        .button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-out; /* Butonun akıcı hareket etmesi için */
            position: absolute; /* Mutlak konumlandırma */
            white-space: nowrap; 
        }

        #good-button {
            background-color: #4CAF50; 
            color: white;
            /* Başlangıçta sola konumlandırılır */
        }

        #good-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        #bad-button {
            background-color: #FF6347; 
            color: white;
            /* Başlangıçta sağa konumlandırılır */
        }

        /* Cevap mesajı stili */
        #message {
            margin-top: 40px;
            font-size: 1.5em;
            color: #333;
            display: none;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <h1>Günün nasıl geçti Sıla? 😊</h1>

    <div id="button-container">
        <button id="good-button" class="button" onclick="handleAnswer('good')">✅ İyi</button>
        <button id="bad-button" class="button">❌ Kötü</button>
    </div>

    <div id="message"></div>

    <script>
        const badButton = document.getElementById('bad-button'); // ID güncellendi
        const goodButton = document.getElementById('good-button'); // ID eklendi
        const buttonContainer = document.getElementById('button-container');
        const messageDiv = document.getElementById('message');

        // *** BUTONU KAÇIRAN FONKSİYON ***
        const runAway = function() {
            const containerRect = buttonContainer.getBoundingClientRect();
            const badButtonRect = badButton.getBoundingClientRect();

            // Butonun kendi boyutunu düşerek sınırların içinde kalmasını sağlarız
            const newX = Math.random() * (containerRect.width - badButtonRect.width);
            const newY = Math.random() * (containerRect.height - badButtonRect.height);

            // Yeni pozisyonları doğrudan top ve left ile ata
            badButton.style.left = `${newX}px`;
            badButton.style.top = `${newY}px`;
        };
        
        // 1. OLAY: Fare butona yaklaştığı anda kaç (Tıklamayı imkansız hale getirir).
        badButton.addEventListener('mouseover', runAway);

        // 2. OLAY: Tıklama olayını tamamen engelle ve uyarı ver.
        badButton.addEventListener('click', function(event) {
            event.preventDefault(); // Tıklama olayının varsayılan hareketini durdurur
            alert("Yakalamaya çalıştın! Ama 'Kötü' cevabı kabul edilmiyor! 😉");
            runAway(); // Tıklamaya çalışılınca tekrar kaçır.
        });

        // İYİ cevabını işleyen fonksiyon
        function handleAnswer(answer) {
            if (answer === 'good') {
                messageDiv.textContent = 'Harika! Günün güzel geçmesine çok sevindim Sıla! 🎉';
                messageDiv.style.display = 'block';
            }
        }
        
        // Sayfa yüklendiğinde butonların başlangıç konumunu ayarla
        window.onload = function() {
            const containerWidth = buttonContainer.offsetWidth;
            const containerHeight = buttonContainer.offsetHeight;
            const horizontalGap = 30; // Butonlar arası boşluk
            
            // İyi butonu (sol tarafta)
            const goodLeft = (containerWidth / 2) - goodButton.offsetWidth - horizontalGap;
            const centerTop = (containerHeight / 2) - (goodButton.offsetHeight / 2);

            goodButton.style.left = `${goodLeft}px`; 
            goodButton.style.top = `${centerTop}px`;

            // Kötü butonu (sağ tarafta)
            const badLeft = (containerWidth / 2) + horizontalGap;
            badButton.style.left = `${badLeft}px`; 
            badButton.style.top = `${centerTop}px`;
        };
    </script>

</body>
</html>
